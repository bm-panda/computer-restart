[bmscriptsbox.info]
id = "a408a78a-6bab-4b62-ae00-492cb79c5323"              
name = "重启计算机"                                    
desc = "Windows重启脚本、配合不忙脚本盒子可实现快速定时重启计算机"                                  
version = "1.0.0"                                        
icon = "cq.png"   

[bmscriptsbox.runtime]
language = "bat"  
language_version = ">=0.0.0"             
entry = "main.cmd"                   
terminal = "never"   
binaries = [{name = "nircmd"}]     

[bmscriptsbox.triggers]
[bmscriptsbox.triggers.context_menu]                   
enabled = true                                 
targets = ["background"]                        

[bmscriptsbox.triggers.shortcut]                          
enabled = true                                  

[bmscriptsbox.schedule]
enabled = true                              







